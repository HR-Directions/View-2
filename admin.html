<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة التحكم العالمية - صيدليات د. وائل حافظ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة إكسيل العالمية SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Cairo', 'sans-serif'] }, colors: { brand: '#1e3a8a', adminBg: '#f8fafc' } } } }
    </script>
    <style> 
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; } 
        /* نظام التوستس */
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; width: 90%; max-width: 400px; }
        .toast { background: white; color: #1e293b; padding: 14px 20px; border-radius: 12px; font-weight: 700; font-size: 13px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15); border-right: 4px solid #10b981; animation: slideDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; display: flex; align-items: center; gap: 10px; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* القائمة الجانبية للموبايل */
        @media (max-width: 768px) {
            aside { position: fixed; top: 0; right: -100%; height: 100vh; transition: right 0.3s ease; }
            aside.open { right: 0; }
            #overlay { display: none; }
            #overlay.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 10; }
        }
        
        .custom-blur { backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        .logo-img { content: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRd02k3Q6kJ5SP7oTsyCA-j7jUiadX4SfBqfzeJaRkor3sOJ6oD0OOnUxNV&s=10'); }
    </style>
</head>
<body class="text-slate-800 flex h-screen overflow-hidden">

    <div id="overlay" onclick="toggleSidebar()"></div>

    <!-- القائمة الجانبية -->
    <aside id="sidebar" class="w-64 bg-slate-900 text-white flex flex-col shadow-2xl z-20 shrink-0">
        <div class="p-6 border-b border-slate-800 flex flex-col items-center text-center mt-2 relative">
            <button class="md:hidden absolute top-4 left-4 text-slate-400 text-xl" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
            <img src="#" alt="Logo" class="logo-img w-16 h-16 rounded-xl border border-slate-700 shadow-lg mb-3 object-cover bg-white">
            <h1 class="font-black text-lg tracking-wide text-white">صيدليات د. وائل</h1>
            <span class="bg-brand text-white text-[9px] px-2.5 py-0.5 rounded-full mt-2 font-bold tracking-widest">ENTERPRISE v4.0</span>
        </div>
        <nav class="flex-grow p-4 space-y-2 mt-2 overflow-y-auto">
            <button onclick="switchTab('dashboard')" id="btn-dashboard" class="w-full flex items-center gap-3 text-right p-3 rounded-xl font-bold bg-brand text-white transition"><i class="fa-solid fa-chart-pie w-5 text-center"></i> لوحة الإحصائيات</button>
            <button onclick="switchTab('orders')" id="btn-orders" class="w-full flex items-center gap-3 text-right p-3 rounded-xl font-bold text-slate-400 hover:bg-slate-800 transition relative"><i class="fa-solid fa-basket-shopping w-5 text-center"></i> إدارة الطلبات <span id="ordersBadge" class="absolute left-3 bg-red-500 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center hidden">0</span></button>
            <button onclick="switchTab('products')" id="btn-products" class="w-full flex items-center gap-3 text-right p-3 rounded-xl font-bold text-slate-400 hover:bg-slate-800 transition"><i class="fa-solid fa-pills w-5 text-center"></i> إدارة المنتجات و Excel</button>
            <button onclick="switchTab('stories')" id="btn-stories" class="w-full flex items-center gap-3 text-right p-3 rounded-xl font-bold text-slate-400 hover:bg-slate-800 transition"><i class="fa-solid fa-circle-play w-5 text-center"></i> الحالات الفورية (Stories)</button>
            <button onclick="switchTab('customers')" id="btn-customers" class="w-full flex items-center gap-3 text-right p-3 rounded-xl font-bold text-slate-400 hover:bg-slate-800 transition"><i class="fa-solid fa-users w-5 text-center"></i> قاعدة العملاء</button>
        </nav>
    </aside>

    <!-- المحتوى -->
    <main class="flex-grow flex flex-col h-screen overflow-y-auto relative bg-slate-50/50 w-full">
        <header class="bg-white shadow-sm p-4 flex justify-between items-center sticky top-0 z-10 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <button class="md:hidden text-slate-600 text-xl w-10 h-10 bg-slate-100 rounded-lg flex items-center justify-center" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                <h2 id="pageTitle" class="text-base md:text-xl font-black text-slate-800 flex items-center gap-2 truncate"><i class="fa-solid fa-chart-pie text-brand"></i> لوحة الإحصائيات</h2>
            </div>
            <button onclick="window.location.reload()" class="bg-blue-50 text-brand border border-blue-100 px-3 py-2 rounded-xl font-bold text-xs hover:bg-brand hover:text-white transition shrink-0"><i class="fa-solid fa-rotate-right md:mr-1"></i> <span class="hidden md:inline">تحديث</span></button>
        </header>

        <div class="p-4 md:p-6 pb-20">
            
            <!-- 0. الإحصائيات -->
            <section id="sec-dashboard" class="block">
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center text-center">
                        <div class="w-12 h-12 rounded-full bg-blue-50 text-brand flex items-center justify-center text-xl mb-2"><i class="fa-solid fa-box-open"></i></div>
                        <p class="text-[11px] text-slate-400 font-bold">الطلبات</p><h3 class="text-xl font-black text-slate-800" id="statOrders">0</h3>
                    </div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center text-center">
                        <div class="w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl mb-2"><i class="fa-solid fa-pills"></i></div>
                        <p class="text-[11px] text-slate-400 font-bold">المنتجات</p><h3 class="text-xl font-black text-slate-800" id="statProducts">0</h3>
                    </div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center text-center">
                        <div class="w-12 h-12 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center text-xl mb-2"><i class="fa-solid fa-users"></i></div>
                        <p class="text-[11px] text-slate-400 font-bold">العملاء</p><h3 class="text-xl font-black text-slate-800" id="statCustomers">0</h3>
                    </div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center text-center">
                        <div class="w-12 h-12 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center text-xl mb-2"><i class="fa-solid fa-money-bill-wave"></i></div>
                        <p class="text-[11px] text-slate-400 font-bold">إجمالي الإيرادات</p><h3 class="text-lg font-black text-amber-600 truncate w-full" id="statRevenue">0 ج</h3>
                    </div>
                </div>
            </section>

            <!-- 1. الطلبات -->
            <section id="sec-orders" class="hidden">
                <input type="text" id="searchOrdersInput" oninput="filterOrders()" placeholder="بحث بالاسم أو الهاتف..." class="w-full p-4 bg-white border border-slate-200 rounded-2xl text-sm font-bold outline-none focus:border-brand mb-5 shadow-sm">
                <div id="ordersList" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5"></div>
            </section>

            <!-- 2. المنتجات (مع Excel) -->
            <section id="sec-products" class="hidden">
                
                <!-- أزرار الإكسيل -->
                <div class="flex flex-wrap gap-3 mb-6 bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                    <div class="w-full md:w-auto text-sm font-black text-slate-700 flex items-center gap-2 mb-2 md:mb-0"><i class="fa-solid fa-file-excel text-emerald-600 text-lg"></i> إدارة البيانات عبر إكسيل (Excel):</div>
                    <div class="flex-grow flex gap-2">
                        <button onclick="exportToExcel()" class="flex-1 bg-emerald-50 text-emerald-700 border border-emerald-200 py-2.5 rounded-xl font-bold text-xs hover:bg-emerald-600 hover:text-white transition flex items-center justify-center gap-2 shadow-sm"><i class="fa-solid fa-download"></i> تصدير للإكسيل</button>
                        
                        <label class="flex-1 bg-blue-50 text-brand border border-blue-200 py-2.5 rounded-xl font-bold text-xs hover:bg-brand hover:text-white transition flex items-center justify-center gap-2 shadow-sm cursor-pointer">
                            <i class="fa-solid fa-upload"></i> استيراد / تحديث
                            <input type="file" id="excelFile" accept=".xlsx, .xls" class="hidden" onchange="importFromExcel(event)">
                        </label>
                    </div>
                </div>

                <!-- فورم الإضافة -->
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 mb-6">
                    <h3 class="font-black text-sm mb-4 text-brand border-b pb-2">إضافة منتج يدوياً</h3>
                    <form id="productForm" onsubmit="addProduct(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="pName" required placeholder="اسم المنتج" class="border p-3.5 rounded-xl bg-slate-50 font-bold text-sm outline-none focus:border-brand">
                        <input type="number" id="pPrice" required placeholder="السعر (ج.م)" class="border p-3.5 rounded-xl bg-slate-50 font-bold text-sm outline-none focus:border-brand">
                        <input type="url" id="pImg" required placeholder="رابط الصورة" class="border p-3.5 rounded-xl bg-slate-50 font-bold text-sm outline-none focus:border-brand md:col-span-2" dir="ltr">
                        
                        <div class="flex items-center justify-between border p-3.5 rounded-xl bg-slate-50">
                            <label class="font-bold text-slate-700 text-xs">تفعيل الخصم؟</label>
                            <input type="checkbox" id="pHasDiscount" class="w-5 h-5 accent-brand" onchange="document.getElementById('pDiscount').disabled = !this.checked">
                        </div>
                        <input type="number" id="pDiscount" disabled placeholder="نسبة الخصم (%)" class="border p-3.5 rounded-xl bg-slate-50 font-bold text-sm outline-none focus:border-brand disabled:opacity-50">
                        
                        <!-- المنتج المميز -->
                        <div class="flex items-center justify-between border p-3.5 rounded-xl bg-amber-50 border-amber-100 md:col-span-2">
                            <label class="font-bold text-amber-700 text-xs flex items-center gap-2"><i class="fa-solid fa-star"></i> تمييز كمنتج الأفضل مبيعاً (يظهر في شريط الواجهة)</label>
                            <input type="checkbox" id="pIsFeatured" class="w-5 h-5 accent-amber-500">
                        </div>

                        <textarea id="pDetails" placeholder="التفاصيل..." class="border p-3.5 rounded-xl bg-slate-50 font-bold text-sm outline-none focus:border-brand md:col-span-2" rows="2"></textarea>
                        
                        <button type="submit" class="bg-brand text-white font-black p-4 rounded-xl md:col-span-2 hover:bg-blue-900 transition flex items-center justify-center gap-2 text-sm shadow-md"><i class="fa-solid fa-plus"></i> إضافة المنتج</button>
                    </form>
                </div>

                <input type="text" id="searchProductsInput" oninput="filterProducts()" placeholder="بحث بالاسم..." class="w-full p-4 bg-white border border-slate-200 rounded-2xl text-sm font-bold outline-none focus:border-brand mb-4 shadow-sm">

                <div class="overflow-x-auto bg-white rounded-2xl shadow-sm border border-slate-100">
                    <table class="w-full text-right text-xs md:text-sm">
                        <thead class="bg-slate-50 border-b text-slate-500 font-bold">
                            <tr><th class="p-4">الصورة</th><th class="p-4">المنتج</th><th class="p-4">السعر</th><th class="p-4 text-center">مميز</th><th class="p-4 text-center">الإجراء</th></tr>
                        </thead>
                        <tbody id="productsTableBody" class="font-semibold text-slate-700"></tbody>
                    </table>
                </div>
            </section>

            <!-- 3. الحالات -->
            <section id="sec-stories" class="hidden">
                 <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 mb-6">
                    <form id="storyForm" onsubmit="addStory(event)" class="flex flex-col gap-4">
                        <select id="sProduct" required class="border p-4 rounded-xl bg-slate-50 font-bold text-sm outline-none focus:border-brand"></select>
                        <input type="url" id="sImg" placeholder="رابط صورة مخصصة (اختياري)" class="border p-4 rounded-xl bg-slate-50 font-bold text-sm outline-none" dir="ltr">
                        <button type="submit" class="bg-amber-500 text-white font-black p-4 rounded-xl hover:bg-amber-600 transition text-sm shadow-md">نشر الحالة</button>
                    </form>
                </div>
                <div id="storiesList" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
            </section>

            <!-- 4. العملاء -->
            <section id="sec-customers" class="hidden">
                <input type="text" id="searchCustomersInput" oninput="filterCustomers()" placeholder="بحث بالاسم أو الهاتف..." class="w-full p-4 bg-white border border-slate-200 rounded-2xl text-sm font-bold outline-none focus:border-brand mb-4 shadow-sm">
                <div class="overflow-x-auto bg-white rounded-2xl shadow-sm border border-slate-100 p-1">
                    <table class="w-full text-right text-xs md:text-sm">
                        <thead class="bg-slate-50 text-slate-500 font-bold">
                            <tr><th class="p-4">الاسم</th><th class="p-4">الهاتف</th><th class="p-4">العنوان</th><th class="p-4 text-center">حذف</th></tr>
                        </thead>
                        <tbody id="customersTableBody" class="font-semibold text-slate-700"></tbody>
                    </table>
                </div>
            </section>

        </div>
    </main>

    <!-- مودال تعديل المنتج -->
    <div id="editProductModal" class="fixed inset-0 bg-slate-900/80 custom-blur z-50 hidden flex justify-center items-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-slate-100 flex flex-col max-h-[95vh]">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50 shrink-0">
                <h3 class="font-black text-sm"><i class="fa-solid fa-edit text-brand ml-1"></i> تعديل المنتج</h3>
                <button onclick="closeEditProductModal()" class="text-slate-400 hover:text-red-500 bg-white w-8 h-8 rounded-full shadow flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-5 overflow-y-auto space-y-4 flex-grow">
                <input type="hidden" id="editProdId">
                <input type="text" id="editProdName" class="w-full border p-3 rounded-xl bg-slate-50 font-bold text-sm" placeholder="الاسم">
                <input type="number" id="editProdPrice" class="w-full border p-3 rounded-xl bg-slate-50 font-bold text-sm" placeholder="السعر">
                <input type="url" id="editProdImg" class="w-full border p-3 rounded-xl bg-slate-50 font-bold text-sm" dir="ltr" placeholder="URL">
                
                <div class="flex items-center justify-between border p-3 rounded-xl bg-slate-50">
                    <label class="font-bold text-xs">خصم؟</label>
                    <input type="checkbox" id="editProdHasDiscount" class="w-5 h-5 accent-brand" onchange="document.getElementById('editProdDiscount').disabled = !this.checked">
                </div>
                <input type="number" id="editProdDiscount" class="w-full border p-3 rounded-xl bg-slate-50 font-bold text-sm disabled:opacity-50" placeholder="%">
                
                <div class="flex items-center justify-between border p-3 rounded-xl bg-amber-50 border-amber-100">
                    <label class="font-bold text-amber-700 text-xs">منتج مميز (الأفضل)؟</label>
                    <input type="checkbox" id="editProdIsFeatured" class="w-5 h-5 accent-amber-500">
                </div>

                <textarea id="editProdDetails" rows="2" class="w-full border p-3 rounded-xl bg-slate-50 font-bold text-sm"></textarea>
            </div>
            <div class="p-4 border-t flex gap-3 bg-slate-50 shrink-0">
                <button onclick="saveProductEdits()" class="flex-grow bg-brand text-white font-black py-3 rounded-xl text-sm">حفظ</button>
            </div>
        </div>
    </div>

    <!-- حاوية التوستس -->
    <div id="toast-container"></div>

    <script>
        const DB_URL = 'https://story-64520-default-rtdb.firebaseio.com/';
        let products = {}; let orders = {}; let stories = {}; let customers = {};

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = type === 'success' ? `<i class="fa-solid fa-check text-emerald-500"></i> <span>${message}</span>` : `<i class="fa-solid fa-triangle-exclamation text-red-500"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        document.addEventListener('DOMContentLoaded', () => { loadData('dashboard'); });

        function switchTab(tab) {
            ['dashboard', 'orders', 'products', 'stories', 'customers'].forEach(t => {
                document.getElementById(`sec-${t}`).classList.add('hidden');
                document.getElementById(`btn-${t}`).classList.replace('bg-brand', 'hover:bg-slate-800');
                document.getElementById(`btn-${t}`).classList.remove('text-white', 'shadow-lg');
                document.getElementById(`btn-${t}`).classList.add('text-slate-400');
            });
            
            document.getElementById(`sec-${tab}`).classList.remove('hidden');
            document.getElementById(`btn-${tab}`).classList.replace('hover:bg-slate-800', 'bg-brand');
            document.getElementById(`btn-${tab}`).classList.remove('text-slate-400');
            document.getElementById(`btn-${tab}`).classList.add('text-white', 'shadow-lg');
            
            const titles = { dashboard: 'الإحصائيات', orders: 'الطلبات الواردة', products: 'المنتجات (Excel)', stories: 'الحالات', customers: 'العملاء' };
            const icons = { dashboard: 'chart-pie', orders: 'basket-shopping', products: 'pills', stories: 'circle-play', customers: 'users' };
            document.getElementById('pageTitle').innerHTML = `<i class="fa-solid fa-${icons[tab]} text-brand"></i> ${titles[tab]}`;

            if(window.innerWidth <= 768) toggleSidebar();
            loadData(tab);
        }

        async function loadData(tab) {
            try {
                const [oRes, pRes, sRes, cRes] = await Promise.all([ fetch(`${DB_URL}cart_orders.json`), fetch(`${DB_URL}products.json`), fetch(`${DB_URL}stories.json`), fetch(`${DB_URL}customers.json`) ]);
                orders = await oRes.json() || {}; products = await pRes.json() || {}; stories = await sRes.json() || {}; customers = await cRes.json() || {};
                
                updateDashboardStats();
                if(tab === 'orders') renderOrders();
                else if(tab === 'products') { renderProducts(); updateProductSelect(); }
                else if(tab === 'stories') renderStories();
                else if(tab === 'customers') renderCustomers();
            } catch(e) {}
        }

        function updateDashboardStats() {
            document.getElementById('statOrders').textContent = Object.keys(orders).length;
            document.getElementById('statProducts').textContent = Object.keys(products).length;
            document.getElementById('statStories').textContent = Object.keys(stories).length;
            document.getElementById('statCustomers').textContent = Object.keys(customers).length;
            
            let rev = 0; let pending = 0;
            Object.values(orders).forEach(o => { if(o.status === 'delivered') rev += (o.total||0); if(o.status === 'pending') pending++; });
            document.getElementById('statRevenue').textContent = `${rev} ج`;
            
            const b = document.getElementById('ordersBadge');
            if(pending > 0) { b.textContent = pending; b.classList.remove('hidden'); } else b.classList.add('hidden');
        }

        function updateProductSelect() {
            const s = document.getElementById('sProduct');
            s.innerHTML = '<option value="">-- اختر المنتج --</option>';
            Object.keys(products).forEach(k => s.innerHTML += `<option value="${k}">${products[k].name}</option>`);
        }

        // --- الأوامر الرئيسية للرندرة ---
        function renderOrders() {
            const c = document.getElementById('ordersList'); c.innerHTML = '';
            Object.keys(orders).reverse().forEach(key => {
                const o = orders[key];
                const bg = { pending: 'bg-red-50', preparing: 'bg-amber-50', out_for_delivery: 'bg-blue-50', delivered: 'bg-emerald-50' }[o.status];
                const txt = { pending: 'مراجعة', preparing: 'تجهيز', out_for_delivery: 'توصيل', delivered: 'تم' }[o.status];
                
                c.innerHTML += `
                    <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 flex flex-col order-card" data-search="${o.customer.name} ${o.customer.phone}">
                        <div class="flex justify-between items-start mb-2">
                            <h4 class="font-black text-sm text-brand truncate"><i class="fa-solid fa-user-circle mr-1"></i> ${o.customer.name}</h4>
                            <span class="text-[10px] font-black px-2 py-0.5 rounded-full ${bg}">${txt}</span>
                        </div>
                        <p class="text-xs font-bold text-slate-500 mb-2" dir="ltr">${o.customer.phone}</p>
                        <div class="mb-3 bg-slate-50 p-2 rounded-xl text-xs flex-grow">${o.items.map(i=>`<div>x${i.qty} ${i.name}</div>`).join('')}</div>
                        <div class="flex justify-between items-center font-black mb-3 text-sm"><span>المطلوب:</span><span class="text-brand">${o.total} ج</span></div>
                        <select onchange="updateOrderStatus('${key}', this.value)" class="w-full bg-slate-50 border border-slate-200 text-xs font-bold p-2 rounded-xl outline-none mb-2">
                            <option value="pending" ${o.status==='pending'?'selected':''}>قيد المراجعة</option>
                            <option value="preparing" ${o.status==='preparing'?'selected':''}>تجهيز</option>
                            <option value="out_for_delivery" ${o.status==='out_for_delivery'?'selected':''}>خرج للتوصيل</option>
                            <option value="delivered" ${o.status==='delivered'?'selected':''}>تم التسليم</option>
                        </select>
                        <button onclick="deleteData('cart_orders', '${key}')" class="text-red-400 text-xs font-bold hover:text-red-600 w-full p-2 bg-red-50 rounded-xl">حذف نهائي</button>
                    </div>`;
            });
        }

        async function updateOrderStatus(id, val) { await fetch(`${DB_URL}cart_orders/${id}.json`, { method: 'PATCH', body: JSON.stringify({status: val}) }); showToast('تم تحديث حالة الطلب'); loadData('orders'); }

        function renderProducts() {
            const tb = document.getElementById('productsTableBody'); tb.innerHTML = '';
            Object.keys(products).forEach(k => {
                const p = products[k];
                tb.innerHTML += `
                    <tr class="border-b border-slate-50 product-row" data-search="${p.name}">
                        <td class="p-3"><img src="${p.imageUrl}" class="w-10 h-10 rounded-lg object-cover" onerror="this.src='https://placehold.co/50'"></td>
                        <td class="p-3 font-bold text-xs">${p.name}</td>
                        <td class="p-3 font-black text-brand text-xs">${p.price} ج</td>
                        <td class="p-3 text-center">${p.isFeatured ? '<i class="fa-solid fa-star text-amber-500"></i>' : '-'}</td>
                        <td class="p-3 text-center flex justify-center gap-2">
                            <button onclick="openEditProductModal('${k}')" class="bg-blue-50 text-brand w-7 h-7 rounded shadow-sm"><i class="fa-solid fa-edit text-xs"></i></button>
                            <button onclick="deleteData('products', '${k}')" class="bg-red-50 text-red-500 w-7 h-7 rounded shadow-sm"><i class="fa-solid fa-trash text-xs"></i></button>
                        </td>
                    </tr>`;
            });
        }

        function renderStories() {
            const c = document.getElementById('storiesList'); c.innerHTML = '';
            Object.keys(stories).forEach(k => {
                const s = stories[k]; const pName = products[s.productId] ? products[s.productId].name : 'محذوف';
                const img = s.imageUrl || (products[s.productId] ? products[s.productId].imageUrl : '');
                c.innerHTML += `
                    <div class="bg-white rounded-2xl overflow-hidden shadow-sm relative group">
                        <img src="${img}" class="w-full h-32 object-cover">
                        <div class="absolute bottom-2 left-1 right-1 text-center text-[10px] font-bold text-white bg-black/60 rounded px-1 truncate">${pName}</div>
                        <button onclick="deleteData('stories', '${k}')" class="absolute top-2 right-2 bg-red-600 text-white w-6 h-6 rounded-full opacity-0 group-hover:opacity-100"><i class="fa-solid fa-trash text-[10px]"></i></button>
                    </div>`;
            });
        }

        function renderCustomers() {
            const tb = document.getElementById('customersTableBody'); tb.innerHTML = '';
            Object.keys(customers).forEach(k => {
                const c = customers[k];
                tb.innerHTML += `
                    <tr class="border-b border-slate-50 customer-row" data-search="${c.name} ${c.phone}">
                        <td class="p-3 font-bold text-xs text-brand">${c.name}</td>
                        <td class="p-3 font-bold text-xs" dir="ltr">${c.phone}</td>
                        <td class="p-3 text-[10px] text-slate-500 max-w-[100px] truncate">${c.address}</td>
                        <td class="p-3 text-center"><button onclick="deleteData('customers', '${k}')" class="bg-red-50 text-red-500 w-7 h-7 rounded"><i class="fa-solid fa-trash text-xs"></i></button></td>
                    </tr>`;
            });
        }

        // --- عمليات الإضافة والتعديل ---
        async function addProduct(e) {
            e.preventDefault();
            const data = { name: document.getElementById('pName').value, price: parseFloat(document.getElementById('pPrice').value), imageUrl: document.getElementById('pImg').value, details: document.getElementById('pDetails').value, hasDiscount: document.getElementById('pHasDiscount').checked, discountPercent: document.getElementById('pHasDiscount').checked ? parseFloat(document.getElementById('pDiscount').value) : 0, isFeatured: document.getElementById('pIsFeatured').checked, timestamp: Date.now() };
            await fetch(`${DB_URL}products.json`, { method: 'POST', body: JSON.stringify(data) });
            e.target.reset(); document.getElementById('pDiscount').disabled = true; showToast('تمت إضافة المنتج'); loadData('products');
        }

        async function addStory(e) {
            e.preventDefault();
            await fetch(`${DB_URL}stories.json`, { method: 'POST', body: JSON.stringify({ productId: document.getElementById('sProduct').value, imageUrl: document.getElementById('sImg').value, timestamp: Date.now() }) });
            e.target.reset(); showToast('تم نشر الحالة'); loadData('stories');
        }

        function openEditProductModal(id) {
            const p = products[id];
            document.getElementById('editProdId').value = id; document.getElementById('editProdName').value = p.name; document.getElementById('editProdPrice').value = p.price; document.getElementById('editProdImg').value = p.imageUrl;
            document.getElementById('editProdHasDiscount').checked = p.hasDiscount||false; document.getElementById('editProdDiscount').disabled = !(p.hasDiscount||false); document.getElementById('editProdDiscount').value = p.discountPercent||0;
            document.getElementById('editProdIsFeatured').checked = p.isFeatured||false; document.getElementById('editProdDetails').value = p.details||'';
            document.getElementById('editProductModal').classList.remove('hidden'); document.getElementById('editProductModal').classList.add('flex');
        }
        function closeEditProductModal() { document.getElementById('editProductModal').classList.add('hidden'); }
        
        async function saveProductEdits() {
            const id = document.getElementById('editProdId').value; const hd = document.getElementById('editProdHasDiscount').checked;
            const data = { name: document.getElementById('editProdName').value, price: parseFloat(document.getElementById('editProdPrice').value), imageUrl: document.getElementById('editProdImg').value, hasDiscount: hd, discountPercent: hd ? parseFloat(document.getElementById('editProdDiscount').value) : 0, isFeatured: document.getElementById('editProdIsFeatured').checked, details: document.getElementById('editProdDetails').value };
            await fetch(`${DB_URL}products/${id}.json`, { method: 'PATCH', body: JSON.stringify(data) });
            closeEditProductModal(); showToast('تم التعديل بنجاح'); loadData('products');
        }

        async function deleteData(path, key) { if(confirm('تأكيد الحذف؟')) { await fetch(`${DB_URL}${path}/${key}.json`, { method: 'DELETE' }); showToast('تم الحذف'); loadData(path === 'cart_orders' ? 'orders' : path); } }

        // فلاتر البحث
        function filterOrders() { const q = document.getElementById('searchOrdersInput').value.toLowerCase(); document.querySelectorAll('.order-card').forEach(c => c.style.display = c.dataset.search.toLowerCase().includes(q) ? 'flex' : 'none'); }
        function filterProducts() { const q = document.getElementById('searchProductsInput').value.toLowerCase(); document.querySelectorAll('.product-row').forEach(c => c.style.display = c.dataset.search.toLowerCase().includes(q) ? 'table-row' : 'none'); }
        function filterCustomers() { const q = document.getElementById('searchCustomersInput').value.toLowerCase(); document.querySelectorAll('.customer-row').forEach(c => c.style.display = c.dataset.search.toLowerCase().includes(q) ? 'table-row' : 'none'); }

        // ================== نظام الإكسيل (Excel) المتقدم ==================
        function exportToExcel() {
            if(Object.keys(products).length === 0) return showToast('لا توجد منتجات لتصديرها', 'error');
            
            // تحضير البيانات بصيغة مفهومة للإكسيل
            const dataToExport = Object.keys(products).map(key => {
                const p = products[key];
                return {
                    "معرف النظام (ID) - لا تقم بتعديله": key,
                    "اسم المنتج": p.name || "",
                    "السعر (ج.م)": p.price || 0,
                    "رابط الصورة (URL)": p.imageUrl || "",
                    "المنتج مميز (الأفضل)؟": p.isFeatured ? "نعم" : "لا",
                    "يوجد خصم؟": p.hasDiscount ? "نعم" : "لا",
                    "نسبة الخصم (%)": p.discountPercent || 0,
                    "التفاصيل": p.details || ""
                };
            });

            const worksheet = XLSX.utils.json_to_sheet(dataToExport);
            
            // تحسين عرض الأعمدة
            const wscols = [ {wch: 25}, {wch: 35}, {wch: 15}, {wch: 40}, {wch: 20}, {wch: 15}, {wch: 15}, {wch: 50} ];
            worksheet['!cols'] = wscols;

            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "المنتجات");
            
            // تحميل الملف
            XLSX.writeFile(workbook, `منتجات_صيدليات_وائل_حافظ_${new Date().toISOString().split('T')[0]}.xlsx`);
            showToast('تم تحميل ملف الإكسيل بنجاح!');
        }

        async function importFromExcel(event) {
            const file = event.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    showToast('جاري تحليل ملف الإكسيل ومزامنة القاعدة...', 'success');
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonProducts = XLSX.utils.sheet_to_json(worksheet);

                    let updatedCount = 0;
                    let addedCount = 0;

                    for(let row of jsonProducts) {
                        const id = row["معرف النظام (ID) - لا تقم بتعديله"];
                        const name = row["اسم المنتج"];
                        const price = parseFloat(row["السعر (ج.م)"]);
                        
                        if(!name || isNaN(price)) continue; // تجاهل الصفوف غير الصالحة

                        const productData = {
                            name: name,
                            price: price,
                            imageUrl: row["رابط الصورة (URL)"] || "https://placehold.co/300",
                            isFeatured: row["المنتج مميز (الأفضل)؟"] === "نعم",
                            hasDiscount: row["يوجد خصم؟"] === "نعم",
                            discountPercent: parseFloat(row["نسبة الخصم (%)"]) || 0,
                            details: row["التفاصيل"] || "",
                            timestamp: Date.now()
                        };

                        if(id && products[id]) {
                            // تحديث منتج موجود
                            await fetch(`${DB_URL}products/${id}.json`, { method: 'PATCH', body: JSON.stringify(productData) });
                            updatedCount++;
                        } else {
                            // إضافة منتج جديد (إذا كان الـ ID فارغ أو غير موجود)
                            await fetch(`${DB_URL}products.json`, { method: 'POST', body: JSON.stringify(productData) });
                            addedCount++;
                        }
                    }

                    showToast(`تمت المزامنة بنجاح! تم تحديث ${updatedCount} وإضافة ${addedCount} منتج.`);
                    loadData('products');
                } catch(error) {
                    showToast('حدث خطأ أثناء قراءة الملف، تأكد من الصيغة.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
            event.target.value = ''; // إعادة تعيين لرفع نفس الملف مجدداً إن لزم
        }
    </script>
